[package]
name = "privstrip"
version = "0.1.0"
edition = "2024"

[features]
# Apple-only acceleration. candle's `accelerate` and `metal` features link
# against macOS frameworks and fail on Linux, so Linux/container builds use
# `--no-default-features`. No #[cfg] in src/ depends on this: candle ships a
# stub Metal backend, so `--metal` simply errors at runtime when it's off.
default = ["apple"]
apple = [
    "candle-core/accelerate",
    "candle-nn/accelerate",
    "candle-core/metal",
    "candle-nn/metal",
]

[dependencies]
candle-core = "0.10.2"
candle-nn = "0.10.2"
tokenizers = "0.22.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
# Used by the CLI and by DecoderMode's ValueEnum derive, so that the library and
# the CLI accept exactly the same decoder spellings.
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# Line tables make samply / Instruments / lldb backtraces meaningful at
# essentially zero runtime cost (DWARF sections only, no codegen change).
debug = "line-tables-only"
