[package]
name = "privstrip"
version = "0.1.0"
edition = "2024"

[dependencies]
candle-core = { version = "0.10.2", features = ["accelerate", "metal"] }
candle-nn = { version = "0.10.2", features = ["accelerate", "metal"] }
tokenizers = "0.22.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "thin"
# Line tables make samply / Instruments / lldb backtraces meaningful at
# essentially zero runtime cost (DWARF sections only, no codegen change).
debug = "line-tables-only"
